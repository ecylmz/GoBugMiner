name: Package
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv sync --all-groups
      - run: uv build
      - run: uv run --isolated --with ./dist/gobugminer-*.whl gobugminer --help
      - run: ./scripts/reproduce_offline.sh
